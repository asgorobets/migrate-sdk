name: Customer Peers

on:
  pull_request:
    paths:
      - ".github/workflows/customer-peers.yml"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/test-customer-peers.mjs"
      - "scripts/fixtures/customer-peer-consumer.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/customer-peers.yml"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/test-customer-peers.mjs"
      - "scripts/fixtures/customer-peer-consumer.mjs"

permissions:
  contents: read

jobs:
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:customer-peers
